route:
  receiver: default-slack
  group_by:
    - alertname
    - cluster
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: pagerduty-oncall

receivers:
  - name: default-slack
    slack_configs:
      - api_url_file: "/etc/alertmanager/secrets/slack_url"
        channel: "#alerts"

  - name: pagerduty-oncall
    pagerduty_configs:
      - routing_key_file: "/etc/alertmanager/secrets/pd_key"
